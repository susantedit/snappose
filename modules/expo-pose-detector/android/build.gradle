apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.posedetector'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
if (expoModulesCorePlugin.exists()) {
  apply from: expoModulesCorePlugin
  applyKotlinExpoModulesCorePlugin()
}

android {
  compileSdkVersion rootProject.ext.has('compileSdkVersion') ? rootProject.ext.get('compileSdkVersion') : 34

  defaultConfig {
    minSdkVersion rootProject.ext.has('minSdkVersion') ? rootProject.ext.get('minSdkVersion') : 26
    targetSdkVersion rootProject.ext.has('targetSdkVersion') ? rootProject.ext.get('targetSdkVersion') : 34
    versionCode 1
    versionName "1.0.0"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')

  // Google MediaPipe Tasks Vision — On-Device 33-Landmark Pose Detection
  implementation 'com.google.mediapipe:tasks-vision:0.10.14'

  // Android CameraX
  implementation 'androidx.camera:camera-core:1.3.4'
  implementation 'androidx.camera:camera-camera2:1.3.4'
  implementation 'androidx.camera:camera-lifecycle:1.3.4'

  // Lifecycle (required for ProcessCameraProvider.bindToLifecycle)
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
